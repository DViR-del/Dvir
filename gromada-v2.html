.cover{height:110px;position:relative}.gear{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px}

.stv{width:100%;height:100%;display:grid;place-content:center;gap:12px;text-align:center;color:#fff;padding:24px;cursor:pointer}
.stv h2{margin:0;font:600 24px/1.3 Unbounded,Onest,system-ui,sans-serif}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:30;width:max-content;max-width:90%}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PPL={o:["Вадим Давиденко","#C8372D"],a:["Андрій Мельник","#1F5FBF"],m:["Марія Тарасенко","#2E8B57"],t:["Тарас Бойко","#8E5BB5"],i:["Ірина Власенко","#C26A12"],d:["Данило Шевчук","#16222E"],me:["Ви","#5C6B7A"]};
const G=["linear-gradient(135deg,#F5B800,#C8372D)","linear-gradient(135deg,#1F5FBF,#5B9BF5)","linear-gradient(135deg,#2E8B57,#9AD9B0)","linear-gradient(135deg,#8E5BB5,#F2B5AE)","linear-gradient(135deg,#C26A12,#F5B800)","linear-gradient(135deg,#16222E,#1F5FBF)"];

const ON={o:1,a:0,t:1};
const ST={me:"Тут з’явиться ваша історія на 24 години.",o:"Доброго ранку з Подолу!",a:"Новий білд гри вже в тестуванні.",t:"Прибирання берега, 10:00.",i:"Карпати, день третій.",m:"Борщ вийшов ідеальним."};
const S={tab:"fr",friends:new Set(["o","a","t"]),follow:new Set(["i"]),liked:new Set(),vl:new Set(),open:new Set(),seen:new Set(),fts:"dm",pi:null,pp:false,t:0,status:null,pt:"wall",chrono:true,saver:false,pause:true,ver:false,chat:null,cur:"feed"};
let N=100;S.name="";S.int=new Set();const IN=["Музика","Кіно","Подорожі","Спорт","Ігри","Кулінарія","Фото","Технології"];
const POSTS=[
{u:"o",t:"15 хв тому",x:"Ранок на Подолі. Книгарня відчинилась, кава вже готова.",g:0,l:124,k:18},
{u:"a",t:"1 год тому",x:"Закінчили демо нашої гри. Дякую всім, хто тестував!",g:1,l:87,k:23},

{u:"d",t:"вчора",x:"Три поради для початківців у фотографії: світло, кут і терпіння.",g:5,l:75,k:12},
{u:"o",t:"вчора",x:"Хтось слухає живу музику на вихідних? Підкажіть гурти.",g:-1,l:41,k:27}
];
POSTS.forEach((p,i)=>p.id=i);
const V=[
{h:"maria_kuhar",x:"Борщ за 60 секунд",c:"Домашній рецепт без зайвого",s:"Оригінальний звук, Марія",l:12400,k:310,g:4},
{h:"danylo_foto",x:"3 поради для кращих кадрів",c:"Світло, кут, фон",s:"Кава на Подолі, Сонячна Хвиля",l:8300,k:142,g:5},
{h:"taras_run",x:"Ранкова пробіжка набережною",c:"П’ять кілометрів до сніданку",s:"Дніпро тече, Хвилі й Береги",l:5100,k:76,g:2},

];

const CH=[
{k:"dm",n:"Вадим Давиденко",u:"o",m:[["o","Привіт! Ти будеш у суботу на обміні книжок?"]]},
{k:"dm",n:"Андрій Мельник",u:"a",m:[["a","Скинув тобі збірку демо-ліній, глянь."]]},
{k:"gr",n:"Університетські друзі",u:"t",c:"#8E5BB5",m:[["t","Хто йде на вихідних у похід?"],["i","Я за!"]]},
{k:"gr",n:"Команда гри",u:"a",c:"#1F5FBF",m:[["a","Реліз у п’ятницю, не забудьте протестувати."]]},
{k:"ch",n:"Новини технологій",s:"12,5 тис.",c:"#2E8B57",m:[["ch","Вийшло оновлення популярного редактора коду. Що нового."]]},
{k:"ch",n:"Кіно та серіали",s:"8,2 тис.",c:"#C26A12",m:[["ch","Добірка українських фільмів на вихідні."]]}
];

function feed(){

 return `<div class="stories">${st}</div>`+tabs(S.tab,[["fr","Друзі"],["sub","Підписки"],["rec","Рекомендації"]],"tab")+(ps.map(post).join("")||empty("Тут поки тихо","Додайте друзів або підпишіться на цікавих людей.","Знайти людей"))+`<button class="fab" data-a="new">Новий допис</button>`;

const rows=(l,fn)=>l.map(fn).join("");
document.addEventListener("change",e=>{const t=e.target;
 if(t.id=="bgf"&&t.files[0]){CH[S.chat].bg=`url(${URL.createObjectURL(t.files[0])})`;close();toast("Фон встановлено");go()}
 if(t.id=="pv1")S.msgw=t.value;
 if(t.id=="pv2")S.cmtw=t.value;
});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,i=b.dataset.i,idx=+i,u=b.dataset.u;
 switch(a){
 case"new":S.co=new Set();$("#sheet .end").insertAdjacentHTML("beforebegin",`<div class="mut">Співавтори (необов’язково)</div><div class="chips" style="padding:0;flex-wrap:wrap">${rows([...S.friends],f=>`<button class="chip" data-a="co" data-i="${f}">${PPL[f][0].split(" ")[0]}</button>`)}</div>`);return;
 case"co":S.co.has(i)?S.co.delete(i):S.co.add(i);b.classList.toggle("on");return;
 case"pub2":{const p=POSTS[0];if($("#sheet").hidden&&S.co.size&&p&&p.u=="me"&&!p.ca){p.ca=[...S.co];S.co=new Set();go()}return}
 case"th":pick("Тема чату",rows(THM,(t,j)=>`<button class="rw" data-a="thp" data-i="${j}">${t[0]}</button>`)+`<label class="chip" style="align-self:flex-start">Своє фото на фон<input type="file" id="bgf" accept="image/*" hidden></label>`,"");return;
 case"thp":CH[S.chat].bg=THM[idx][1];close();toast("Тему змінено");break;
 case"reqs":pick("Заявки на підписку",REQ.length?rows(REQ,r=>`<div class="rw">${av(r)}<div class="grow"><b>${PPL[r][0]}</b></div><button class="chip" data-a="racc" data-i="${r}">Прийняти</button><button class="chip" data-a="rdec" data-i="${r}">Відхилити</button></div>`):`<p class="mut">Нових заявок немає.</p>`,"");return;
 case"racc":case"rdec":{const k=REQ.indexOf(i);if(k>=0)REQ.splice(k,1);if(a=="racc")FOL.push(i);toast(a=="racc"?"Заявку прийнято":"Заявку відхилено");b.closest(".rw").remove();go();return}
 case"fols":pick("Підписники",FOL.length?rows(FOL,f=>`<div class="rw">${av(f)}<div class="grow"><b>${PPL[f][0]}</b></div><button class="chip" data-a="frm" data-i="${f}">Видалити</button></div>`):`<p class="mut">Поки немає підписників.</p>`,"");return;
 case"frm":{const k=FOL.indexOf(i);if(k>=0)FOL.splice(k,1);b.closest(".rw").remove();go();toast("Підписника видалено");return}
 case"blks":{const l=rows([...S.blk],x=>`<div class="rw">${av(x)}<div class="grow"><b>${PPL[x][0]}</b><div class="mut">Заблоковано</div></div><button class="chip" data-a="unb" data-i="${x}">Розблокувати</button></div>`)+rows([...S.rst],x=>`<div class="rw">${av(x)}<div class="grow"><b>${PPL[x][0]}</b><div class="mut">Обмежено</div></div><button class="chip" data-a="unr" data-i="${x}">Зняти</button></div>`);pick("Заблоковані й обмежені",l||`<p class="mut">Список порожній.</p>`,"");return}
 case"unb":S.blk.delete(i);b.closest(".rw").remove();go();return;
 case"unr":S.rst.delete(i);b.closest(".rw").remove();go();return;
 case"prv0":pick("Так бачать ваш профіль незнайомці",`<div style="text-align:center;padding:12px"><span class="av" style="--c:#5C6B7A;width:64px;height:64px;font-size:26px">В</span><h3>Ваш профіль</h3><p class="mut">Профіль закритий. Підпишіться, щоб побачити публікації, фото й список друзів.</p><button class="btn">Надіслати заявку</button></div>`,"");return;
 case"pm":{const p=POSTS.find(x=>x.id==idx);if(!p||p.u=="me")return;const n=PPL[p.u][0].split(" ")[0];pick("Публікація",`<button class="rw" data-a="prep" data-i="${idx}">Поскаржитись на маркування 18+</button><button class="rw" data-a="phide" data-i="${idx}">Сховати цю публікацію</button><button class="rw" data-a="hu" data-i="${p.u}">Ховати всі публікації: ${n}</button><button class="rw" data-a="rst" data-i="${p.u}">Обмежити: ${n}</button><button class="rw" data-a="blk" data-i="${p.u}">Заблокувати: ${n}</button>`,"");return}
 case"hu":S.hu.add(i);close();toast("Публікації цього користувача приховано");break;
 case"rst":S.rst.add(i);close();toast("Користувача обмежено");return;
 case"blk":S.blk.add(i);S.friends.delete(i);S.follow.delete(i);close();toast("Користувача заблоковано");break;
 case"freq":S.req.add(i);toast("Заявку на підписку надіслано");if($("#sq"))res($("#sq").value);else go();return;
 case"cols":pick("Мої добірки",rows(S.cols,c=>`<div class="post"><b>${esc(c.n)}</b><div class="mut">${c.u.length?c.u.map(x=>PPL[x][0]).join(", "):"Поки порожньо"}</div></div>`)+`<input id="cn" placeholder="Нова добірка: назва">`,"mkcol");return;
 case"mkcol":{const n=$("#cn").value.trim();if(!n){toast("Введіть назву добірки");return}S.cols.push({n,u:[]});close();toast("Добірку створено");return}
 case"tocol":pick("Додати до добірки",rows(S.cols,(c,j)=>`<button class="rw" data-a="addcol" data-i="${j}" data-u="${i}">${esc(c.n)}</button>`),"");return;
 case"addcol":{const c=S.cols[idx];if(!c.u.includes(u))c.u.push(u);close();toast("Додано до добірки «"+c.n+"»");return}
 case"inv":S.pu=i;pick("Запросити до проєкту: "+PPL[i][0].split(" ")[0],rows(S.prj,(p,j)=>`<button class="rw" data-a="invp" data-i="${j}" data-u="${i}">${esc(p.n)}</button>`)+`<input id="pjn" placeholder="Або створіть новий проєкт">`,"newprj");return;
 case"invp":{const p=S.prj[idx];if(!p.m.includes(u))p.m.push(u);close();toast("Запрошення до «"+p.n+"» надіслано");return}
 case"newprj":{const n=$("#pjn").value.trim();if(!n){toast("Оберіть проєкт або введіть назву");return}S.prj.push({n,m:[S.pu]});close();toast("Проєкт створено, запрошення надіслано");return}
 default:return;
 }
 go();
});
go();
</script>

<script>
const HND={o:"vadym",a:"andrii",m:"maria",t:"taras",i:"iryna",d:"danylo"};
const UBIO={o:"Люблю каву, музику й відеоігри 🎮 Збираю сквад для нічних каток.",a:"Роблю ігри та музику. Відкритий до співпраці ✌️",t:"Бігаю набережною, пишу музику. Щосуботи прибираємо берег.",i:"Мандрую Карпатами з камерою 📷",m:"Готую борщ і розповідаю про це в інтернеті 🍲",d:"Фотограф. Світло, кут, терпіння."};
R.user=()=>{
 const u=S.vu||"o",n=PPL[u][0],fr=S.friends.has(u),fo=S.follow.has(u),pv=PRIVU.has(u),lock=pv&&!fo&&!fr;
 const act=fr?`<span class="chip on">У друзях</span>`:fo?`<span class="chip on">Ви стежите</span>`:pv?`<button class="chip" data-a="freq" data-i="${u}">${S.req.has(u)?"Заявку надіслано":"Подати заявку"}</button>`:`<button class="btn" data-a="fol" data-i="${u}">Стежити</button>`;
 const ps=lock?`<div class="empty"><b>Профіль закритий</b><span class="mut">Подайте заявку, щоб побачити публікації.</span></div>`:(POSTS.filter(p=>p.u==u&&!S.hid.has(p.id)&&(S.show18||!p.a)).map(p2).join("")||empty("Публікацій поки немає","Тут з’являться нові дописи."));
 return `<div class="rw"><button class="chip" data-a="ubk">Назад</button><b>${n}</b></div><div class="cover" style="background:${G[u.charCodeAt(0)%6]}"></div><section class="pf">${av(u,72)}<h2>${n}</h2><div class="mut">@${HND[u]}${ON[u]?", онлайн":""}</div><div class="chips" style="padding:6px 0 0;flex-wrap:wrap">${(PLB[u]||[]).map(x=>`<span class="chip">${x}</span>`).join("")}</div>${lock?"":`<p style="margin:8px 0">${esc(UBIO[u]||"")}</p>`}<div class="chips" style="padding:8px 0 0;flex-wrap:wrap">${act}${lock?"":`<button class="chip" data-a="dm" data-i="${u}">Написати</button><button class="chip" data-a="tocol" data-i="${u}">В добірку</button><button class="chip" data-a="inv" data-i="${u}">До проєкту</button>`}</div></section>${ps}`;
};
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a=usr],[data-a=ubk]");if(!b)return;
 if(b.dataset.a=="ubk"){history.length>1?history.back():(location.hash="feed");return}
 const u=b.dataset.i;close();
 if(u=="me"){location.hash="me";return}
 S.vu=u;if(location.hash=="#user")go();else location.hash="user";
});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key=="Enter"&&t.dataset&&t.dataset.a=="usr")t.click()});
go();
</script>
