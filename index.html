<style>
:root{--bg:#F3F5F7;--card:#fff;--ink:#16222E;--muted:#5C6B7A;--acc:#1F5FBF;--onacc:#fff;--sun:#F5B800;--red:#C8372D;--grn:#2E8B57;--line:#DDE3E9;--soft:#E8EEF6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Onest,system-ui,"Segoe UI",Roboto,sans-serif}

button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.app{max-width:480px;margin:0 auto;min-height:100vh;border-inline:1px solid var(--line);padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);padding:12px 16px 18px;display:flex;align-items:center;justify-content:space-between}

.sr{max-height:55vh;overflow:auto;margin:0 -16px}

.lg{height:34px;width:auto;display:block}.lg .w{fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}

.mut{color:var(--muted);font-size:14px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:11px 0;color:var(--muted)}
.tabs .on{border-color:var(--sun);color:var(--ink);font-weight:600}

.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;font-weight:600;flex:none}

.cm{margin-top:8px;padding:8px 12px;background:var(--soft);border-radius:10px;font-size:14px}

.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:9px 16px;font-weight:600;font-size:15px}
.chips{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}

.sty{background:none;border:0;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted);padding:0}
.rg{padding:3px;border-radius:50%;background:conic-gradient(var(--sun),var(--red),var(--sun))}.rg.seen{background:var(--line)}

.empty{padding:40px 24px;text-align:center}.empty b{display:block;font-size:18px}
.vs{height:calc(100svh - 150px);overflow-y:auto;scroll-snap-type:y mandatory}
.vd{height:100%;scroll-snap-align:start;position:relative;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}

.np{margin:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:grid;gap:8px}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--sun)}
.cur{background:var(--soft)}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:8px 12px}
.msg.me{margin-left:auto;background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.cin{display:flex;gap:8px;padding:12px;background:var(--card)}
.cin input,#sheet textarea{flex:1;min-width:0;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cover{height:110px;position:relative}.gear{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px}
.pf{padding:1px 16px 12px;background:var(--card)}.pf .av{margin-top:-36px;position:relative;border:4px solid var(--card)}
.pf h2{margin:6px 0 0;font-size:20px}
.stats{display:flex;gap:28px;margin-top:10px;color:var(--muted);font-size:14px}.stats b{display:block;font-size:18px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid i{aspect-ratio:1}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.sw{width:46px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{transform:translateX(18px)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:12px;color:var(--muted);text-decoration:none}
nav a.on{color:var(--acc);font-weight:600}nav svg{width:24px;height:24px;fill:currentColor}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--sun);color:#16222E;border:0;border-radius:99px;padding:12px 18px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#sheet{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--card);width:min(480px,100%);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sh h3{margin:0}.end{display:flex;justify-content:flex-end;gap:8px}
.stv{width:100%;height:100%;display:grid;place-content:center;gap:12px;text-align:center;color:#fff;padding:24px;cursor:pointer}
.stv h2{margin:0;font:600 24px/1.3 Unbounded,Onest,system-ui,sans-serif}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:30;width:max-content;max-width:90%}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>
<style>
.bl{filter:blur(22px);pointer-events:none;user-select:none}
.b18{position:relative;overflow:hidden;border-radius:10px}
.rv{position:absolute;inset:0;border:0;background:rgba(0,0,0,.45);color:#fff;font-weight:600;display:grid;place-content:center;gap:4px;text-align:center}
.rv small{font-weight:400}
.tag{font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--red);color:#fff;margin-left:6px}
.att{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--soft);border-radius:10px;margin:8px 0;font-size:14px}
.rx{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.cov{width:56px;height:56px;border-radius:12px;flex:none}
input[type=range]{width:100%;accent-color:var(--sun)}
.mn,.post a{color:var(--acc)}

</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PPL={o:["Вадим Давиденко","#C8372D"],a:["Андрій Мельник","#1F5FBF"],m:["Марія Тарасенко","#2E8B57"],t:["Тарас Бойко","#8E5BB5"],i:["Ірина Власенко","#C26A12"],d:["Данило Шевчук","#16222E"],me:["Ви","#5C6B7A"]};
const G=["linear-gradient(135deg,#F5B800,#C8372D)","linear-gradient(135deg,#1F5FBF,#5B9BF5)","linear-gradient(135deg,#2E8B57,#9AD9B0)","linear-gradient(135deg,#8E5BB5,#F2B5AE)","linear-gradient(135deg,#C26A12,#F5B800)","linear-gradient(135deg,#16222E,#1F5FBF)"];
const GC=["#1F5FBF","#8E5BB5","#2E8B57","#C26A12","#C8372D"];
const ON={o:1,a:0,t:1};
const ST={me:"Тут з’явиться ваша історія на 24 години.",o:"Доброго ранку з Подолу!",a:"Новий білд гри вже в тестуванні.",t:"Прибирання берега, 10:00.",i:"Карпати, день третій.",m:"Борщ вийшов ідеальним."};
const S={tab:"fr",friends:new Set(["o","a","t"]),follow:new Set(["i"]),liked:new Set(),vl:new Set(),open:new Set(),seen:new Set(),fts:"dm",pi:null,pp:false,t:0,status:null,pt:"wall",chrono:true,saver:false,pause:true,ver:false,chat:null,cur:"feed"};
let N=100;S.name="";S.int=new Set();const IN=["Музика","Кіно","Подорожі","Спорт","Ігри","Кулінарія","Фото","Технології"];
const POSTS=[
{u:"o",t:"15 хв тому",x:"Ранок на Подолі. Книгарня відчинилась, кава вже готова.",g:0,l:124,k:18},
{u:"a",t:"1 год тому",x:"Закінчили демо нашої гри. Дякую всім, хто тестував!",g:1,l:87,k:23},
{u:"t",t:"3 год тому",x:"Субота на набережній: прибрали берег і спекли картоплю на вогнищі.",g:2,l:156,k:31},
{u:"i",t:"5 год тому",x:"Нове фото з відпустки в Карпатах.",g:3,l:203,k:44},
{u:"m",t:"6 год тому",x:"Домашній борщ із пампушками. Рецепт у коментарях.",g:4,l:318,k:92},
{u:"d",t:"вчора",x:"Три поради для початківців у фотографії: світло, кут і терпіння.",g:5,l:75,k:12},
{u:"o",t:"вчора",x:"Хтось слухає живу музику на вихідних? Підкажіть гурти.",g:-1,l:41,k:27}
];
POSTS.forEach((p,i)=>p.id=i);
const V=[
{h:"maria_kuhar",x:"Борщ за 60 секунд",c:"Домашній рецепт без зайвого",s:"Оригінальний звук, Марія",l:12400,k:310,g:4},
{h:"danylo_foto",x:"3 поради для кращих кадрів",c:"Світло, кут, фон",s:"Кава на Подолі, Сонячна Хвиля",l:8300,k:142,g:5},
{h:"taras_run",x:"Ранкова пробіжка набережною",c:"П’ять кілометрів до сніданку",s:"Дніпро тече, Хвилі й Береги",l:5100,k:76,g:2},
{h:"iryna_travel",x:"Карпати за одну хвилину",c:"Маршрут у коментарях",s:"Карпатський вітер, Полонина",l:21700,k:508,g:3}
];
const T=[["Місто засинає","Нічні Трамваї","3:24",204],["Кава на Подолі","Сонячна Хвиля","2:58",178],["Карпатський вітер","Полонина","4:10",250],["Дзвінок із дитинства","Ранкові Птахи","3:02",182],["Дніпро тече","Хвилі й Береги","3:47",227]];
const CH=[
{k:"dm",n:"Вадим Давиденко",u:"o",m:[["o","Привіт! Ти будеш у суботу на обміні книжок?"]]},
{k:"dm",n:"Андрій Мельник",u:"a",m:[["a","Скинув тобі збірку демо-ліній, глянь."]]},
{k:"gr",n:"Університетські друзі",u:"t",c:"#8E5BB5",m:[["t","Хто йде на вихідних у похід?"],["i","Я за!"]]},
{k:"gr",n:"Команда гри",u:"a",c:"#1F5FBF",m:[["a","Реліз у п’ятницю, не забудьте протестувати."]]},
{k:"ch",n:"Новини технологій",s:"12,5 тис.",c:"#2E8B57",m:[["ch","Вийшло оновлення популярного редактора коду. Що нового."]]},
{k:"ch",n:"Кіно та серіали",s:"8,2 тис.",c:"#C26A12",m:[["ch","Добірка українських фільмів на вихідні."]]}
];
const WALL=[{u:"o",t:"2 год тому",x:"З наступаючим днем народження! Торт за мною."},{u:"a",t:"вчора",x:"Додав фото з минулого походу в альбом «Друзі»."}];

const fm=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const fk=n=>n>=1000?(n/1000).toFixed(1).replace(".",",")+" тис.":n;
const av=(k,s=40)=>`<span class="av" style="--c:${PPL[k][1]};width:${s}px;height:${s}px;font-size:${s*.42}px">${PPL[k][0][0]}</span>`;
const cav=(c,s)=>c.k=="dm"?av(c.u,s):`<span class="av sq" style="--c:${c.c};width:${s}px;height:${s}px">${c.n[0]}</span>`;
const H=(t,s)=>`<div class="hd"><h1>${t}</h1>${s?`<p class="mut">${s}</p>`:""}</div>`;
const empty=(a,b,c)=>`<div class="empty"><b>${a}</b><span class="mut">${b}</span>${c?`<div style="margin-top:14px"><button class="btn" data-a="srch">${c}</button></div>`:""}</div>`;
const tabs=(cur,l,a)=>`<div class="tabs">${l.map(x=>`<button class="${cur==x[0]?"on":""}" data-a="${a}" data-i="${x[0]}">${x[1]}</button>`).join("")}</div>`;

const post=p=>{const L=S.liked.has(p.id);return `<article class="post"><div class="row">${av(p.u)}<div class="grow"><b>${PPL[p.u][0]}</b><div class="mut">${p.t}</div></div>${p.u!="me"&&!S.follow.has(p.u)&&!S.friends.has(p.u)?`<button class="chip" data-a="fol" data-i="${p.u}">Стежити</button>`:""}</div><p>${esc(p.x)}</p>${p.g>=0?`<div class="pic" style="background:${G[p.g]}"></div>`:""}<div class="acts"><button data-a="like" data-i="${p.id}" class="${L?"on":""}" aria-pressed="${L}">${L?"♥":"♡"} ${p.l+(L?1:0)}</button><button data-a="cm" data-i="${p.id}">Коментарі ${p.k}</button><button data-a="shr">Поділитись</button></div>${S.open.has(p.id)?`<div class="cm"><b>Марія:</b> Супер!<br><b>Андрій:</b> Дуже круто, дякую, що поділились.</div>`:""}</article>`};

function feed(){
 const ps=POSTS.filter(p=>S.tab=="fr"?S.friends.has(p.u)||p.u=="me":S.tab=="sub"?S.follow.has(p.u):!S.friends.has(p.u)&&!S.follow.has(p.u)&&p.u!="me");
 const st=["me","o","a","t","i","m"].map(u=>`<button class="sty" data-a="story" data-i="${u}"><span class="rg ${S.seen.has(u)?"seen":""}">${av(u,56)}</span>${u=="me"?"Ваша":PPL[u][0].split(" ")[0]}</button>`).join("");
 return `<div class="stories">${st}</div>`+tabs(S.tab,[["fr","Друзі"],["sub","Підписки"],["rec","Рекомендації"]],"tab")+(ps.map(post).join("")||empty("Тут поки тихо","Додайте друзів або підпишіться на цікавих людей.","Знайти людей"))+`<button class="fab" data-a="new">Новий допис</button>`;
}
function video(){
 return `<div class="vs">`+V.map((v,i)=>{const L=S.vl.has(i);return `<section class="vd" style="background:${G[v.g]}"><h2>${v.x}</h2><div class="vside"><button data-a="vlike" data-i="${i}" aria-label="Вподобати">${L?"♥":"♡"}<small>${fk(v.l+(L?1:0))}</small></button><button data-a="cm0" aria-label="Коментарі">…<small>${v.k}</small></button><button data-a="shr" aria-label="Поділитись">↗</button></div><div class="vinfo"><b>@${v.h}</b><div>${v.c}</div><small>♪ ${v.s}</small></div></section>`}).join("")+`</div>`;
}

 case"new":S.co=new Set();$("#sheet .end").insertAdjacentHTML("beforebegin",`<div class="mut">Співавтори (необов’язково)</div><div class="chips" style="padding:0;flex-wrap:wrap">${rows([...S.friends],f=>`<button class="chip" data-a="co" data-i="${f}">${PPL[f][0].split(" ")[0]}</button>`)}</div>`);return;
 case"co":S.co.has(i)?S.co.delete(i):S.co.add(i);b.classList.toggle("on");return;
 case"pub2":{const p=POSTS[0];if($("#sheet").hidden&&S.co.size&&p&&p.u=="me"&&!p.ca){p.ca=[...S.co];S.co=new Set();go()}return}
 case"th":pick("Тема чату",rows(THM,(t,j)=>`<button class="rw" data-a="thp" data-i="${j}">${t[0]}</button>`)+`<label class="chip" style="align-self:flex-start">Своє фото на фон<input type="file" id="bgf" accept="image/*" hidden></label>`,"");return;
 case"thp":CH[S.chat].bg=THM[idx][1];close();toast("Тему змінено");break;
 case"reqs":pick("Заявки на підписку",REQ.length?rows(REQ,r=>`<div class="rw">${av(r)}<div class="grow"><b>${PPL[r][0]}</b></div><button class="chip" data-a="racc" data-i="${r}">Прийняти</button><button class="chip" data-a="rdec" data-i="${r}">Відхилити</button></div>`):`<p class="mut">Нових заявок немає.</p>`,"");return;
 case"racc":case"rdec":{const k=REQ.indexOf(i);if(k>=0)REQ.splice(k,1);if(a=="racc")FOL.push(i);toast(a=="racc"?"Заявку прийнято":"Заявку відхилено");b.closest(".rw").remove();go();return}
 case"fols":pick("Підписники",FOL.length?rows(FOL,f=>`<div class="rw">${av(f)}<div class="grow"><b>${PPL[f][0]}</b></div><button class="chip" data-a="frm" data-i="${f}">Видалити</button></div>`):`<p class="mut">Поки немає підписників.</p>`,"");return;
 case"frm":{const k=FOL.indexOf(i);if(k>=0)FOL.splice(k,1);b.closest(".rw").remove();go();toast("Підписника видалено");return}
 case"blks":{const l=rows([...S.blk],x=>`<div class="rw">${av(x)}<div class="grow"><b>${PPL[x][0]}</b><div class="mut">Заблоковано</div></div><button class="chip" data-a="unb" data-i="${x}">Розблокувати</button></div>`)+rows([...S.rst],x=>`<div class="rw">${av(x)}<div class="grow"><b>${PPL[x][0]}</b><div class="mut">Обмежено</div></div><button class="chip" data-a="unr" data-i="${x}">Зняти</button></div>`);pick("Заблоковані й обмежені",l||`<p class="mut">Список порожній.</p>`,"");return}
 case"unb":S.blk.delete(i);b.closest(".rw").remove();go();return;
 case"unr":S.rst.delete(i);b.closest(".rw").remove();go();return;
 case"prv0":pick("Так бачать ваш профіль незнайомці",`<div style="text-align:center;padding:12px"><span class="av" style="--c:#5C6B7A;width:64px;height:64px;font-size:26px">В</span><h3>Ваш профіль</h3><p class="mut">Профіль закритий. Підпишіться, щоб побачити публікації, фото й список друзів.</p><button class="btn">Надіслати заявку</button></div>`,"");return;
 case"pm":{const p=POSTS.find(x=>x.id==idx);if(!p||p.u=="me")return;const n=PPL[p.u][0].split(" ")[0];pick("Публікація",`<button class="rw" data-a="prep" data-i="${idx}">Поскаржитись на маркування 18+</button><button class="rw" data-a="phide" data-i="${idx}">Сховати цю публікацію</button><button class="rw" data-a="hu" data-i="${p.u}">Ховати всі публікації: ${n}</button><button class="rw" data-a="rst" data-i="${p.u}">Обмежити: ${n}</button><button class="rw" data-a="blk" data-i="${p.u}">Заблокувати: ${n}</button>`,"");return}
 case"hu":S.hu.add(i);close();toast("Публікації цього користувача приховано");break;
 case"rst":S.rst.add(i);close();toast("Користувача обмежено");return;
 case"blk":S.blk.add(i);S.friends.delete(i);S.follow.delete(i);close();toast("Користувача заблоковано");break;
 case"freq":S.req.add(i);toast("Заявку на підписку надіслано");res($("#sq").value);return;
 case"cols":pick("Мої добірки",rows(S.cols,c=>`<div class="post"><b>${esc(c.n)}</b><div class="mut">${c.u.length?c.u.map(x=>PPL[x][0]).join(", "):"Поки порожньо"}</div></div>`)+`<input id="cn" placeholder="Нова добірка: назва">`,"mkcol");return;
 case"mkcol":{const n=$("#cn").value.trim();if(!n){toast("Введіть назву добірки");return}S.cols.push({n,u:[]});close();toast("Добірку створено");return}
 case"tocol":pick("Додати до добірки",rows(S.cols,(c,j)=>`<button class="rw" data-a="addcol" data-i="${j}" data-u="${i}">${esc(c.n)}</button>`),"");return;
 case"addcol":{const c=S.cols[idx];if(!c.u.includes(u))c.u.push(u);close();toast("Додано до добірки «"+c.n+"»");return}
 case"inv":S.pu=i;pick("Запросити до проєкту: "+PPL[i][0].split(" ")[0],rows(S.prj,(p,j)=>`<button class="rw" data-a="invp" data-i="${j}" data-u="${i}">${esc(p.n)}</button>`)+`<input id="pjn" placeholder="Або створіть новий проєкт">`,"newprj");return;
 case"invp":{const p=S.prj[idx];if(!p.m.includes(u))p.m.push(u);close();toast("Запрошення до «"+p.n+"» надіслано");return}
 case"newprj":{const n=$("#pjn").value.trim();if(!n){toast("Оберіть проєкт або введіть назву");return}S.prj.push({n,m:[S.pu]});close();toast("Проєкт створено, запрошення надіслано");return}
 default:return;
 }
 go();
});
go();
</script>
</body>
</html>
